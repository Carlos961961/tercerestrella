<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>¡Gracias por tu compra! — TercerEstrella</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #1A1A2E; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .icon { font-size: 72px; margin-bottom: 24px; }
  h1 { font-family: 'Oswald', sans-serif; font-size: clamp(28px, 5vw, 48px); color: #C0A24A; margin-bottom: 16px; }
  p { color: rgba(255,255,255,0.7); font-size: 17px; line-height: 1.6; max-width: 480px; margin-bottom: 12px; }
  .highlight { color: #74ACDF; font-weight: 600; }
  .btn { display: inline-block; margin-top: 32px; padding: 14px 36px; background: #C0A24A; color: #1A1A2E; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; border-radius: 10px; text-decoration: none; }
  .btn:hover { background: #b09140; }
</style>
</head>
<body>
  <div class="icon">🎉</div>
  <h1>¡Gracias por tu compra!</h1>
  <p>Tu pago fue confirmado. En breve recibirás un email con <span class="highlight">tu código del sorteo</span> y los detalles de tu pedido.</p>
  <p>Revisá tu casilla de correo (incluso la carpeta de spam).</p>
  <p style="font-size:14px;color:rgba(255,255,255,0.4);margin-top:8px;">¿Dudas? Escribinos al <span class="highlight">+54 9 11 3465-2868</span></p>
  <a href="index.html" class="btn">Volver al inicio</a>
</body>
</html>
